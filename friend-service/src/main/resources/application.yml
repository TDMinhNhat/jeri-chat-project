micronaut:
  application:
    name: friend-service
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  server:
    context-path: /friend
    port: 9092
r2dbc:
  datasources:
    default:
      dialect: POSTGRES
      db-type: postgres
      url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/jeri-friend-service
      username: ${POSTGRES_USER:postgres}
      password: ${POSTGRES_PASSWORD:123456789}
consul:
  client:
    defaultZone: ${CONSUL_HOST:localhost}:${CONSUL_PORT:8500}
    registration:
      enabled: true
flyway:
  datasources:
    default:
      enabled: true
      validate-migration-naming: true
      validate-on-migrate: true
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/jeri-friend-service
      username: ${POSTGRES_USER:postgres}
      password: ${POSTGRES_PASSWORD:123456789}
api:
  path:
    friend: /api/v1/friends