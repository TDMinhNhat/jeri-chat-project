micronaut:
  application:
    name: chat-service
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  server:
    port: 9094
    context-path: /chat
#consul:
#  client:
#    registration:
#      enabled: true
#    defaultZone: ${CONSUL_HOST:localhost}:${CONSUL_PORT:8500}
mongodb:
  host: ${MONGODB_HOST:localhost}
  port: ${MONGODB_PORT:27017}
  database: ${MONGODB_DATABASE:jeri-chat-service}
  username: ${MONGODB_USERNAME:jeri-chat-user}
  password: ${MONGODB_PASSWORD:123456789}
minio:
  endpoint: ${MINIO_ENDPOINT:localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:jeri-minio-user}
  secretKey: ${MINIO_SECRET_KEY:123456789}
  bucketName: ${MINIO_BUCKET_NAME:jeri-chat-bucket}
api-path:
  emotion: /api/v1/emotions
  private-chat: /api/v1/private-chats
  group-chat: /api/v1/group-chats