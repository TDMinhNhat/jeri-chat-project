micronaut:
  application:
    name: group-service
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  server:
    context-path: /group
    port: ${GROUP_SERVICE_PORT:10093}
datasources:
  default:
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jeri-group-service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456789}
r2dbc:
  datasources:
    default:
      dialect: POSTGRES
      db-type: postgres
      url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jeri-group-service}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:123456789}
#consul:
#  client:
#    defaultZone: ${CONSUL_HOST:localhost}:${CONSUL_PORT:8500}
#    registration:
#      enabled: true
flyway:
  datasources:
    default:
      enabled: true
      validate-migration-naming: true
      validate-on-migrate: true
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jeri-group-service}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:123456789}
      driver: org.postgresql.Driver
      locations: classpath:db/migration
api:
  path:
    group: /api/v1/groups
    group-member: /api/v1/group-members
minio:
  endpoint: http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:jeri-group-service}
